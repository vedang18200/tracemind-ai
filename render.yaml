services:
  - type: web
    name: tracemind-mcp
    runtime: docker
    plan: free                  
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: TAVILY_API_KEY
        sync: false             
      
      - key: MCP_CLIENT_IP_HEADER
        value: cf-connecting-ip 
      - key: MCP_RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: MCP_GLOBAL_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: SEARCH_DAILY_LIMIT
        value: "30"             
      
